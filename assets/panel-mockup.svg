<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="100%" height="620">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="canvasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11121d" />
      <stop offset="50%" stop-color="#181926" />
      <stop offset="100%" stop-color="#1e1e2e" />
    </linearGradient>

    <!-- Top Bar Gradient -->
    <linearGradient id="barBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e" />
      <stop offset="100%" stop-color="#181825" />
    </linearGradient>

    <!-- Popup Panel Shadow & Gradients -->
    <filter id="panelDropShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#000000" flood-opacity="0.65" />
    </filter>

    <linearGradient id="popupBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e" />
      <stop offset="100%" stop-color="#181825" />
    </linearGradient>

    <linearGradient id="activeBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#89b4fa" />
      <stop offset="100%" stop-color="#cba6f7" />
    </linearGradient>

    <!-- Wallpaper Sample Gradients -->
    <linearGradient id="wp1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#313244" />
      <stop offset="50%" stop-color="#45475a" />
      <stop offset="100%" stop-color="#89b4fa" />
    </linearGradient>

    <linearGradient id="wp2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#585b70" />
      <stop offset="50%" stop-color="#f38ba8" />
      <stop offset="100%" stop-color="#fab387" />
    </linearGradient>

    <linearGradient id="wp3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181825" />
      <stop offset="50%" stop-color="#313244" />
      <stop offset="100%" stop-color="#a6e3a1" />
    </linearGradient>

    <linearGradient id="wp4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e" />
      <stop offset="50%" stop-color="#cba6f7" />
      <stop offset="100%" stop-color="#89b4fa" />
    </linearGradient>

    <linearGradient id="wp5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11111b" />
      <stop offset="50%" stop-color="#1e1e2e" />
      <stop offset="100%" stop-color="#585b70" />
    </linearGradient>

    <linearGradient id="wp6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2030" />
      <stop offset="50%" stop-color="#414868" />
      <stop offset="100%" stop-color="#7aa2f7" />
    </linearGradient>

    <!-- Bottom Vignette for card titles -->
    <linearGradient id="cardVignette" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.85" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .header-text { font-size: 14px; font-weight: 700; fill: #cdd6f4; }
    .card-title { font-size: 10px; font-weight: 500; fill: #ffffff; }
    .badge-text { font-size: 10px; font-weight: 600; fill: #89b4fa; }
    .callout-title { font-size: 13px; font-weight: 700; fill: #cba6f7; }
    .callout-body { font-size: 11.5px; font-weight: 400; fill: #a6adc8; line-height: 1.4; }
  </style>

  <!-- Canvas Background -->
  <rect width="960" height="620" rx="16" fill="url(#canvasBg)" stroke="#313244" stroke-width="1.5" />

  <!-- ================= SECTION 1: TOP BAR ================= -->
  <g transform="translate(32, 24)">
    <!-- Top Bar Container -->
    <rect width="896" height="40" rx="10" fill="url(#barBg)" stroke="#313244" stroke-width="1.2" />

    <!-- Left: Omarchy Logo & Workspaces -->
    <g transform="translate(14, 10)">
      <circle cx="10" cy="10" r="9" fill="#89b4fa" fill-opacity="0.2" />
      <text x="5" y="14" class="sans" font-size="12" font-weight="800" fill="#89b4fa">󰣇</text>
      
      <!-- Workspaces -->
      <g transform="translate(32, 2)">
        <rect width="18" height="16" rx="4" fill="#89b4fa" />
        <text x="6" y="12" class="sans" font-size="10" font-weight="700" fill="#1e1e2e">1</text>
        
        <rect x="22" width="18" height="16" rx="4" fill="#313244" />
        <text x="28" y="12" class="sans" font-size="10" font-weight="600" fill="#a6adc8">2</text>
        
        <rect x="44" width="18" height="16" rx="4" fill="#313244" />
        <text x="50" y="12" class="sans" font-size="10" font-weight="600" fill="#a6adc8">3</text>
      </g>
    </g>

    <!-- Center: Clock -->
    <g transform="translate(416, 25)">
      <text x="0" y="0" class="sans" font-size="12" font-weight="600" fill="#cdd6f4">Wed Oct 21 · 15:42</text>
    </g>

    <!-- Right: Status Area with Wallpaper Hub Widget Highlighted -->
    <g transform="translate(620, 6)">
      <!-- System icons -->
      <g transform="translate(0, 19)">
        <text x="0" y="0" class="sans" font-size="13" fill="#a6adc8">󰤨</text>
        <text x="24" y="0" class="sans" font-size="13" fill="#a6adc8">󰕾 65%</text>
        <text x="76" y="0" class="sans" font-size="13" fill="#a6e3a1">󰁹 98%</text>
      </g>

      <!-- WALLPAPER HUB BAR WIDGET (ACTIVE) -->
      <g id="hubWidget" transform="translate(136, 0)">
        <rect width="130" height="28" rx="7" fill="#89b4fa" fill-opacity="0.18" stroke="#89b4fa" stroke-width="1.5" />
        <text x="10" y="18" class="sans" font-size="13" fill="#89b4fa">󰸉</text>
        <text x="28" y="18" class="sans" font-size="11.5" font-weight="600" fill="#cdd6f4">tokyo_rain</text>
        <circle cx="118" cy="14" r="3" fill="#a6e3a1" />
      </g>
    </g>
  </g>

  <!-- ================= SECTION 2: GESTURE CALLOUT (LEFT OF PANEL) ================= -->
  <g transform="translate(48, 95)">
    <!-- Header -->
    <rect width="320" height="485" rx="12" fill="#181825" stroke="#313244" stroke-width="1" />
    
    <g transform="translate(20, 26)">
      <text x="0" y="0" class="sans" font-size="15" font-weight="800" fill="#cdd6f4">Top-Bar Gesture Controls</text>
      <text x="0" y="18" class="sans" font-size="12" fill="#9399b2">Direct blind switching without popup</text>
    </g>

    <!-- Gesture 1: Scroll Wheel -->
    <g transform="translate(20, 72)">
      <rect width="280" height="74" rx="8" fill="#1e1e2e" stroke="#313244" stroke-width="1" />
      <rect x="12" y="14" width="36" height="46" rx="6" fill="#89b4fa" fill-opacity="0.15" />
      <text x="20" y="42" class="sans" font-size="20">🖱️</text>
      <text x="58" y="32" class="callout-title">Scroll Up / Down</text>
      <text x="58" y="50" class="callout-body">Prev / Next wallpaper</text>
      <rect x="180" y="16" width="90" height="20" rx="10" fill="#a6e3a1" fill-opacity="0.15" />
      <text x="189" y="30" class="sans" font-size="10.5" font-weight="700" fill="#a6e3a1">250ms debounce</text>
    </g>

    <!-- Gesture 2: Middle Click -->
    <g transform="translate(20, 158)">
      <rect width="280" height="66" rx="8" fill="#1e1e2e" stroke="#313244" stroke-width="1" />
      <rect x="12" y="12" width="36" height="42" rx="6" fill="#cba6f7" fill-opacity="0.15" />
      <text x="20" y="38" class="sans" font-size="20">🎲</text>
      <text x="58" y="30" class="callout-title">Middle Click</text>
      <text x="58" y="48" class="callout-body">Randomize wallpaper in scope</text>
    </g>

    <!-- Gesture 3: Left Click -->
    <g transform="translate(20, 236)">
      <rect width="280" height="66" rx="8" fill="#1e1e2e" stroke="#89b4fa" stroke-opacity="0.5" stroke-width="1.2" />
      <rect x="12" y="12" width="36" height="42" rx="6" fill="#89b4fa" fill-opacity="0.2" />
      <text x="20" y="38" class="sans" font-size="20">🖼️</text>
      <text x="58" y="30" class="callout-title" fill="#89b4fa">Left Click</text>
      <text x="58" y="48" class="callout-body">Toggle 3-column gallery panel</text>
    </g>

    <!-- Gesture 4: Right Click -->
    <g transform="translate(20, 314)">
      <rect width="280" height="66" rx="8" fill="#1e1e2e" stroke="#313244" stroke-width="1" />
      <rect x="12" y="12" width="36" height="42" rx="6" fill="#f9e2af" fill-opacity="0.15" />
      <text x="20" y="38" class="sans" font-size="20">⚙️</text>
      <text x="58" y="30" class="callout-title" fill="#fab387">Right Click</text>
      <text x="58" y="48" class="callout-body">Quick context menu &amp; import</text>
    </g>

    <!-- Bottom Feature Callout -->
    <g transform="translate(20, 396)">
      <rect width="280" height="68" rx="8" fill="#11111b" stroke="#313244" stroke-width="1" />
      <text x="14" y="24" class="sans" font-size="12" font-weight="700" fill="#a6e3a1">✓ Zero-Daemon Architecture</text>
      <text x="14" y="42" class="callout-body">No background process consuming RAM.</text>
      <text x="14" y="58" class="callout-body">Executed on demand with native Omarchy CLI.</text>
    </g>
  </g>

  <!-- Connecting Line from Bar to Popup Panel -->
  <path d="M 820 64 L 820 85 L 680 95" stroke="#89b4fa" stroke-width="2" stroke-dasharray="4,4" fill="none" />

  <!-- ================= SECTION 3: POPUP PANEL MOCKUP ================= -->
  <g transform="translate(420, 95)" filter="url(#panelDropShadow)">
    <!-- Popup Panel Card -->
    <rect width="500" height="485" rx="14" fill="url(#popupBg)" stroke="#313244" stroke-width="1.5" />

    <!-- 1. Header Row -->
    <g transform="translate(20, 18)">
      <!-- Left: Title & Icon -->
      <text x="0" y="18" class="sans" font-size="16" fill="#89b4fa">󰸉</text>
      <text x="24" y="18" class="sans" font-size="15" font-weight="800" fill="#ffffff">Wallpaper Hub</text>

      <!-- Theme Badge Pill -->
      <rect x="150" y="2" width="96" height="20" rx="10" fill="#ffffff" fill-opacity="0.08" stroke="#313244" stroke-width="1" />
      <text x="162" y="16" class="sans" font-size="11" font-weight="600" fill="#b4befe">tokyo-night</text>

      <!-- Right Action Buttons -->
      <g transform="translate(390, 0)">
        <!-- Randomize button -->
        <rect width="24" height="24" rx="6" fill="#313244" />
        <text x="6" y="17" class="sans" font-size="13" fill="#cdd6f4">󰒝</text>

        <!-- Close button -->
        <rect x="32" width="24" height="24" rx="6" fill="#313244" />
        <text x="39" y="16" class="sans" font-size="12" fill="#cdd6f4">✕</text>
      </g>
    </g>

    <!-- 2. Scope Tabs (ButtonGroup) -->
    <g transform="translate(20, 56)">
      <rect width="460" height="34" rx="8" fill="#11111b" stroke="#313244" stroke-width="1" />
      
      <!-- Tab 1: Current Theme (Selected) -->
      <rect x="3" y="3" width="150" height="28" rx="6" fill="#89b4fa" fill-opacity="0.22" stroke="#89b4fa" stroke-width="1" />
      <text x="28" y="21" class="sans" font-size="12" font-weight="700" fill="#89b4fa">主题壁纸 · 12</text>

      <!-- Tab 2: Global Library -->
      <text x="200" y="21" class="sans" font-size="12" font-weight="500" fill="#a6adc8">全局库 · 48</text>

      <!-- Tab 3: Favorites -->
      <text x="350" y="21" class="sans" font-size="12" font-weight="500" fill="#a6adc8">收藏夹 · 7</text>
    </g>

    <!-- Separator Line -->
    <line x1="20" y1="102" x2="480" y2="102" stroke="#313244" stroke-width="1" />

    <!-- 3. Main 3-Column Wallpaper Grid -->
    <g transform="translate(20, 114)">
      <!-- Row 1 -->
      <!-- Card 1: Active Wallpaper (Selected with checkmark & hover buttons) -->
      <g transform="translate(0, 0)">
        <rect width="146" height="96" rx="8" fill="url(#wp1)" stroke="#89b4fa" stroke-width="2.2" />
        <rect y="64" width="146" height="32" rx="0" fill="url(#cardVignette)" />
        <text x="10" y="86" class="sans card-title" font-weight="700">tokyo_rain.webp</text>
        
        <!-- Active Badge Top-Left -->
        <rect x="6" y="6" width="20" height="20" rx="10" fill="#89b4fa" />
        <text x="11" y="20" class="sans" font-size="11" font-weight="800" fill="#181825">󰄬</text>

        <!-- Hover Actions Top-Right -->
        <g transform="translate(76, 6)">
          <rect width="18" height="18" rx="9" fill="#000000" fill-opacity="0.6" />
          <text x="4" y="13" class="sans" font-size="10" fill="#f38ba8">󰋑</text>

          <rect x="22" width="18" height="18" rx="9" fill="#000000" fill-opacity="0.6" />
          <text x="26" y="13" class="sans" font-size="10" fill="#ffffff">󰉋</text>

          <rect x="44" width="18" height="18" rx="9" fill="#000000" fill-opacity="0.6" />
          <text x="49" y="13" class="sans" font-size="10" fill="#ffffff">󰩹</text>
        </g>
      </g>

      <!-- Card 2: Favorited Wallpaper -->
      <g transform="translate(156, 0)">
        <rect width="146" height="96" rx="8" fill="url(#wp2)" stroke="#313244" stroke-width="1" />
        <rect y="64" width="146" height="32" rx="0" fill="url(#cardVignette)" />
        <text x="10" y="86" class="sans card-title">fuji_sunset.jpg</text>
        <!-- Heart top-right -->
        <rect x="120" y="6" width="20" height="20" rx="10" fill="#000000" fill-opacity="0.5" />
        <text x="125" y="20" class="sans" font-size="11" fill="#f38ba8">󰋑</text>
      </g>

      <!-- Card 3 -->
      <g transform="translate(312, 0)">
        <rect width="146" height="96" rx="8" fill="url(#wp3)" stroke="#313244" stroke-width="1" />
        <rect y="64" width="146" height="32" rx="0" fill="url(#cardVignette)" />
        <text x="10" y="86" class="sans card-title">forest_mist.png</text>
      </g>

      <!-- Row 2 -->
      <!-- Card 4 -->
      <g transform="translate(0, 108)">
        <rect width="146" height="96" rx="8" fill="url(#wp4)" stroke="#313244" stroke-width="1" />
        <rect y="64" width="146" height="32" rx="0" fill="url(#cardVignette)" />
        <text x="10" y="86" class="sans card-title">cyber_neon.png</text>
      </g>

      <!-- Card 5 -->
      <g transform="translate(156, 108)">
        <rect width="146" height="96" rx="8" fill="url(#wp5)" stroke="#313244" stroke-width="1" />
        <rect y="64" width="146" height="32" rx="0" fill="url(#cardVignette)" />
        <text x="10" y="86" class="sans card-title">vantablack.png</text>
      </g>

      <!-- Card 6 -->
      <g transform="translate(312, 108)">
        <rect width="146" height="96" rx="8" fill="url(#wp6)" stroke="#313244" stroke-width="1" />
        <rect y="64" width="146" height="32" rx="0" fill="url(#cardVignette)" />
        <text x="10" y="86" class="sans card-title">abstract_wave.webp</text>
      </g>

      <!-- Row 3 (Partially visible/scroll indicator) -->
      <g transform="translate(0, 216)" opacity="0.4">
        <rect width="146" height="80" rx="8" fill="url(#wp1)" />
        <rect x="156" width="146" height="80" rx="8" fill="url(#wp3)" />
        <rect x="312" width="146" height="80" rx="8" fill="url(#wp2)" />
      </g>
    </g>

    <!-- Separator Line -->
    <line x1="20" y1="428" x2="480" y2="428" stroke="#313244" stroke-width="1" />

    <!-- 4. Bottom Toolbar -->
    <g transform="translate(20, 442)">
      <!-- Left: Import Buttons -->
      <g transform="translate(0, 0)">
        <!-- Clipboard Button -->
        <rect width="120" height="28" rx="6" fill="#1e1e2e" stroke="#313244" stroke-width="1" />
        <text x="10" y="18" class="sans" font-size="12" fill="#89b4fa">󰅍</text>
        <text x="28" y="18" class="sans" font-size="11.5" font-weight="600" fill="#cdd6f4">剪贴板导入</text>

        <!-- Local File Button -->
        <g transform="translate(128, 0)">
          <rect width="100" height="28" rx="6" fill="#1e1e2e" stroke="#313244" stroke-width="1" />
          <text x="10" y="18" class="sans" font-size="12" fill="#a6e3a1">󰐕</text>
          <text x="28" y="18" class="sans" font-size="11.5" font-weight="600" fill="#cdd6f4">本地图片</text>
        </g>
      </g>

      <!-- Right Action Icons -->
      <g transform="translate(390, 0)">
        <rect width="28" height="28" rx="6" fill="#1e1e2e" stroke="#313244" stroke-width="1" />
        <text x="7" y="19" class="sans" font-size="13" fill="#cdd6f4">󰉋</text>

        <rect x="36" width="28" height="28" rx="6" fill="#1e1e2e" stroke="#313244" stroke-width="1" />
        <text x="43" y="19" class="sans" font-size="13" fill="#cdd6f4">󰑐</text>
      </g>
    </g>
  </g>
</svg>